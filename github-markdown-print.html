<style>
/* ==========================================================================
   github-markdown-print.html

   Print overrides for github-markdown.css, injected with pandoc's
   --include-in-header when rendering to PDF.  The GitHub stylesheet and the
   github-markdown.html template are both built for a screen; three of their
   decisions are wrong on paper and one thing is simply missing.

   Loaded LAST.  $header-includes after the template's own closing style tag,
   so these rules win without editing the template that also builds the HTML.
   ========================================================================== */

/* WHAT WAS MISSING.  The GitHub stylesheet carries no @page rule at all, so
   weasyprint falls back to its default -- A4, and no page number. */
@page {
    size: Letter;
    margin: 0.75in 0.7in 0.8in 0.7in;
    @bottom-right {
        content: counter(page);
        font: 9pt "Segoe UI", sans-serif;
        color: #57606a;
    }
}

/* WHAT WAS WRONG.  The template centres an 980px column and pads it 45px.
   On screen that is a readable measure inside a wide window; on paper the
   @page margin already does that job, so the padding doubles the margin and
   the max-width narrows the text column inside it.  Together they cost about
   a fifth of the page -- CODING-STANDARDS.md renders 69 pages with them and
   57 without. */
.markdown-body { max-width: none; margin: 0; padding: 0; font-size: 10pt; }

/* The dark-mode media query cannot apply in print, but say so explicitly
   rather than depend on that. */
body, .markdown-body { background: #fff; color: #1f2328; }

/* A wide code line is clipped at the page edge instead of wrapping, which
   loses the right-hand end of exactly the lines worth reading. */
.markdown-body pre,
.markdown-body pre > code { white-space: pre-wrap; word-wrap: break-word; }

/* Page-break behaviour the screen never needed. */
.markdown-body h1,
.markdown-body h2,
.markdown-body h3,
.markdown-body h4       { break-after: avoid; }
.markdown-body tr,
.markdown-body pre,
.markdown-body blockquote { break-inside: avoid; }
</style>
