<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>$title$</title>
    
    $if(css)$
    $for(css)$
    <link rel="stylesheet" href="$css$">
    $endfor$
    $endif$

    $if(highlighting-css)$
    <style>$highlighting-css$</style>
    $endif$

    <style>
        /* Additional GitHub-style layout and improvements */
        .markdown-body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 980px;
            margin: 0 auto;
            padding: 45px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        @media (max-width: 767px) {
            .markdown-body {
                padding: 15px;
            }
        }

        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #0d1117;
                color: #c9d1d9;
            }
            .markdown-body {
                background-color: #0d1117;
                color: #c9d1d9;
            }
        }

        /* Print styles */
        @media print {
            .markdown-body {
                max-width: 100%;
                padding: 0;
                margin: 0;
            }
        }

        /* Optional: Improve table appearance */
        .markdown-body table {
            border-collapse: collapse;
            width: 100%;
        }

        .markdown-body th,
        .markdown-body td {
            border: 1px solid #d0d7de;
            padding: 6px 13px;
        }
    </style>

    $for(header-includes)$
    $header-includes$
    $endfor$
</head>
<body>
    <article class="markdown-body">
        $body$
    </article>

    $for(include-after)$
    $include-after$
    $endfor$
</body>
</html>
